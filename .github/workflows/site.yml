name: Check site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check editorial pipeline safeguards
        run: python -m unittest discover -s tests -v
      - name: Validate content and build static site
        run: python tools/build_site.py
      - name: Check internal links and metadata
        run: python tools/check_site.py
